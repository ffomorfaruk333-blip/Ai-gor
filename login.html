<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - OMOR 2.0 Gaming</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;

background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.9)),
url("https://wallpapercave.com/wp/wp5128415.jpg");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

font-family:Arial,sans-serif;
color:white;

padding:20px;
}

.login-box{

width:100%;
max-width:400px;

background:#14141e;

padding:30px;

border-radius:15px;

border:1px solid #00eaff;

text-align:center;
}

h1{
color:#00eaff;
margin-bottom:10px;
}

.subtitle{
color:#aaa;
margin-bottom:20px;
}

input{

width:100%;

padding:13px;

margin:8px 0;

border-radius:8px;

border:1px solid #444;

background:#0b0b12;

color:white;

outline:none;
}

input:focus{
border-color:#00eaff;
}

button{

width:100%;

padding:13px;

margin-top:12px;

border:0;

border-radius:8px;

background:#ff0055;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#message{
margin-top:15px;
font-weight:bold;
}

.links{
margin-top:20px;
}

.links a{
color:#00eaff;
text-decoration:none;
}

.home{
display:block;
margin-top:15px;
color:#aaa !important;
}

</style>

</head>

<body>

<div class="login-box">

<h1>🔐 Login</h1>

<p class="subtitle">
OMOR 2.0 Gaming
</p>

<input
type="email"
id="email"
placeholder="Enter your email"
autocomplete="email"
>

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
>

<button
id="loginButton"
onclick="login()"
>
Login
</button>

<p id="message"></p>

<div class="links">

<p>
Don't have an account?
<a href="signup.html">Sign Up</a>
</p>

<a class="home" href="index.html">
← Back to Home
</a>

</div>

</div>

<script>

function login(){

const email =
document.getElementById("email")
.value
.trim()
.toLowerCase();

const password =
document.getElementById("password")
.value;

const message =
document.getElementById("message");

const button =
document.getElementById("loginButton");

message.textContent="";

if(!email || !password){

message.style.color="#ff4444";
message.textContent=
"Please enter email and password.";

return;
}

const savedUser =
localStorage.getItem("omorUser");

if(!savedUser){

message.style.color="#ff4444";
message.textContent=
"Account not found. Please Sign Up first.";

return;
}

let user;

try{

user=JSON.parse(savedUser);

}catch(error){

message.style.color="#ff4444";
message.textContent=
"Account data is invalid. Please Sign Up again.";

return;
}

const savedEmail =
String(user.email || "")
.trim()
.toLowerCase();

const savedPassword =
String(user.password || "");

if(
email === savedEmail &&
password === savedPassword
){

localStorage.setItem(
"omorLoggedIn",
"true"
);

message.style.color="#00ff88";
message.textContent=
"Login successful!";

button.disabled=true;
button.textContent="Logging in...";

setTimeout(function(){

window.location.href="index.html";

},800);

}else{

message.style.color="#ff4444";
message.textContent=
"Wrong email or password.";

}

}

</script>

</body>

</html>
