<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - OMOR 2.0 Gaming</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 25px;
      background: #1b1b1b;
    }

    header h1 {
      margin: 0;
    }

    .hero {
      max-width: 420px;
      margin: 50px auto;
      padding: 30px;
      background: #1b1b1b;
      border-radius: 15px;
      box-sizing: border-box;
    }

    .hero h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #00c853;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #00a844;
    }

    p {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #00c853;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 OMOR 2.0 Gaming</h1>
  </header>

  <section class="hero">
    <h2>Create Your Account</h2>

    <form id="signupForm">

      <input
        type="text"
        placeholder="Full Name"
        required
      >

      <input
        type="email"
        placeholder="Email"
        required
      >

      <input
        type="password"
        placeholder="Password"
        required
      >

      <input
        type="password"
        placeholder="Confirm Password"
        required
      >

      <button type="submit">Sign Up</button>

    </form>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>
  </section>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://lkucknohutrpumlipzae.supabase.co";

    const SUPABASE_KEY = sb_publishable__HkrqPL9ZFYBVK51_B8WnQ_WvtLuQuV
      

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("signupForm");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const inputs = form.querySelectorAll("input");

      const fullName = inputs[0].value.trim();
      const email = inputs[1].value.trim();
      const password = inputs[2].value;
      const confirmPassword = inputs[3].value;

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              full_name: fullName
            }
          }

        });

      if (error) {
        alert(error.message);
        return;
      }

      alert(
        "Account created successfully! Please check your email to verify your account."
      );

      form.reset();

    });

  </script>

</body>
</html>
